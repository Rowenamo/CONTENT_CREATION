<html>
<head>
    <title>Hyperrealistic Shoes UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .shoe {
            width: 300px;
            height: 200px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            margin: 20px;
        }
        .shoe img {
            width: 100%;
            border-radius: 10px 10px 0 0;
        }
        .shoe h2 {
            text-align: center;
            margin: 10px 0;
        }
        .button {
            display: inline-block;
            background-color: #5cb85c;
            color: white;
            text-align: center;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="shoe">
        <img src="shoe.jpg" alt="Hyperrealistic Shoes">
        <h2>Hyperrealistic Shoes</h2>
        <a href="#" class="button">Buy Now</a>
    </div>
</body>
</html>
